spring.application.name=bot-lanchonete
server.port=8080

# --- IA (Claude) ---
# A chave vem da variavel de ambiente ANTHROPIC_API_KEY (nunca coloque a chave aqui).
ia.modelo=claude-opus-5-5

# --- WhatsApp Cloud API (Meta) ---
# Preencha pelas variaveis de ambiente; deixe vazio para usar so o simulador local.
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:troque-este-token}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.api-version=v23.0
