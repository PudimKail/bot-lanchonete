spring.application.name=bot-lanchonete
server.port=8080

# --- Banco de dados (PostgreSQL) ---
# A senha vem da variavel de ambiente DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bot_lanchonete}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Cria e atualiza as tabelas sozinho a partir das classes @Entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Atendimento ---
# auto = IA se ANTHROPIC_API_KEY estiver configurada, senao menu numerado (gratis). Ou force: ia | menu
bot.modo=${BOT_MODO:auto}

# --- IA (Claude) ---
# A chave vem da variavel de ambiente ANTHROPIC_API_KEY (nunca coloque a chave aqui).
ia.modelo=claude-opus-5-5

# --- WhatsApp Cloud API (Meta) ---
# Preencha pelas variaveis de ambiente; deixe vazio para usar so o simulador local.
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:troque-este-token}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.api-version=v23.0
