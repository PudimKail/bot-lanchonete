<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Lanchonete - Simulador</title>
<style>
  :root { --verde: #075e54; --fundo: #ece5dd; --cliente: #dcf8c6; --bot: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f4; color: #222; }
  main { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1100px; margin: auto; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .chat { display: flex; flex-direction: column; height: 85vh; border-radius: 12px; overflow: hidden; background: var(--fundo); box-shadow: 0 2px 8px #0002; }
  .topo { background: var(--verde); color: #fff; padding: 12px 16px; font-weight: 600; }
  #mensagens { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 85%; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; line-height: 1.35; box-shadow: 0 1px 1px #0001; }
  .cliente { align-self: flex-end; background: var(--cliente); }
  .bot { align-self: flex-start; background: var(--bot); }
  form { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; }
  input { flex: 1; padding: 10px 12px; border: 0; border-radius: 20px; font-size: 15px; }
  button { background: var(--verde); color: #fff; border: 0; border-radius: 20px; padding: 0 16px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; }
  .pedidos { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px #0002; }
  .pedido { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-top: 10px; }
  .pedido h3 { margin: 0 0 4px; font-size: 16px; }
  .pedido small { color: #666; }
</style>
</head>
<body>
<main>
  <section class="chat">
    <div class="topo">Simulador do WhatsApp</div>
    <div id="mensagens"></div>
    <form id="form">
      <input id="texto" placeholder="Digite uma mensagem" autocomplete="off" required>
      <button id="enviar">Enviar</button>
    </form>
  </section>
  <section class="pedidos">
    <h2>Pedidos recebidos</h2>
    <div id="lista"><small>Nenhum pedido ainda.</small></div>
  </section>
</main>
<script>
  const telefone = "5565999990000";
  const mensagens = document.getElementById("mensagens");
  const texto = document.getElementById("texto");
  const enviar = document.getElementById("enviar");

  // Converte o *negrito* do WhatsApp sem interpretar HTML vindo da resposta.
  function adicionar(conteudo, classe) {
    const div = document.createElement("div");
    div.className = "msg " + classe;
    conteudo.split(/(\*[^*\n]+\*)/).forEach(parte => {
      if (/^\*[^*\n]+\*$/.test(parte)) {
        const b = document.createElement("b");
        b.textContent = parte.slice(1, -1);
        div.appendChild(b);
      } else {
        div.appendChild(document.createTextNode(parte));
      }
    });
    mensagens.appendChild(div);
    mensagens.scrollTop = mensagens.scrollHeight;
  }

  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = texto.value.trim();
    if (!msg) return;
    adicionar(msg, "cliente");
    texto.value = "";
    enviar.disabled = true;
    try {
      const r = await fetch("/api/simular", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telefone, mensagem: msg })
      });
      adicionar((await r.json()).resposta, "bot");
      carregarPedidos();
    } catch {
      adicionar("Erro ao falar com o servidor.", "bot");
    } finally {
      enviar.disabled = false;
      texto.focus();
    }
  });

  async function carregarPedidos() {
    const pedidos = await (await fetch("/api/pedidos")).json();
    const lista = document.getElementById("lista");
    if (!pedidos.length) return;
    lista.replaceChildren(...pedidos.map(p => {
      const div = document.createElement("div");
      div.className = "pedido";
      const h3 = document.createElement("h3");
      h3.textContent = `#${p.numero} - ${p.nomeCliente} - R$ ${Number(p.total).toFixed(2)}`;
      const itens = document.createElement("div");
      itens.textContent = p.itens.map(i => `${i.quantidade}x ${i.nome}${i.observacao ? " (" + i.observacao + ")" : ""}`).join(", ");
      const info = document.createElement("small");
      info.textContent = `${p.tipoEntrega === "entrega" ? "Entrega: " + p.endereco : "Retirada"} · ${p.formaPagamento}${p.observacoes ? " · " + p.observacoes : ""}`;
      div.append(h3, itens, info);
      return div;
    }));
  }

  adicionar("Mande um \"oi\" para começar o atendimento.", "bot");
  carregarPedidos();
</script>
</body>
</html>
